name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest,macos-latest ]
        include:
          - os: ubuntu-latest
            platform: linux
            goos: linux
            goarch: amd64
          - os: macos-latest
            platform: darwin
            goos: darwin
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.2'

      - name: Build binaries
        run: |
          mkdir -p build
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ./bin/beacon-${{ matrix.platform }}-${{ matrix.goarch }} ./cmd/cli/beacon/beacon.go
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ./bin/install-${{ matrix.platform }}-${{ matrix.goarch }} ./cmd/cli/install/install.go

      - name: Create release
        run: gh release create ${{ github.ref_name }}-${{ matrix.platform }} ./bin/* --title "Release ${{ github.ref_name }}-${{ matrix.platform }}" --notes "Automated release for ${{ github.ref_name }}-${{ matrix.platform }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}